openapi: 3.1.0
info:
  title: SecretNote Notes API
  version: 1.0.0
  description: API catatan v1. Akses membutuhkan cookie sesi SecretNote yang valid.
servers:
  - url: http://localhost:3000/api/v1
    description: Server pengembangan lokal
security:
  - sessionCookie: []
tags:
  - name: Notes
    description: Operasi catatan milik pengguna yang sedang masuk
paths:
  /notes:
    get:
      operationId: listNotes
      summary: Mendapatkan catatan pengguna aktif
      tags:
        - Notes
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Batas"
        - $ref: "#/components/parameters/Category"
      responses:
        "200":
          description: Daftar catatan dan metadata pagination
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteListResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createNote
      summary: Membuat catatan untuk pengguna aktif
      tags:
        - Notes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNote"
      responses:
        "201":
          description: Catatan berhasil dibuat
          headers:
            Location:
              description: Path relatif menuju detail catatan yang baru dibuat.
              schema:
                type: string
                format: uri-reference
                example: /api/v1/notes/c123456789012345678901234
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /notes/{id}:
    parameters:
      - $ref: "#/components/parameters/NoteId"
    get:
      operationId: getNote
      summary: Mendapatkan detail catatan milik pengguna aktif
      tags:
        - Notes
      responses:
        "200":
          description: Detail catatan
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
    patch:
      operationId: patchNote
      summary: Memperbarui sebagian field catatan milik pengguna aktif
      tags:
        - Notes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchNote"
      responses:
        "200":
          description: Catatan berhasil diperbarui
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteNote
      summary: Menghapus catatan milik pengguna aktif
      tags:
        - Notes
      responses:
        "204":
          description: Catatan berhasil dihapus tanpa response body
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /users/{userId}/notes:
    parameters:
      - $ref: "#/components/parameters/UserId"
      - $ref: "#/components/parameters/Page"
      - $ref: "#/components/parameters/Batas"
      - $ref: "#/components/parameters/Category"
    get:
      operationId: listUserNotes
      summary: Mendapatkan relasi catatan pengguna aktif
      description: Hanya data pengguna yang sama dengan sesi aktif yang dikembalikan.
      tags:
        - Notes
      responses:
        "200":
          description: Daftar catatan pengguna dan metadata pagination
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteListResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: secretnote_session
  headers:
    CacheControl:
      description: Respons privat yang tidak boleh disimpan di cache.
      schema:
        type: string
        const: private, no-store
  parameters:
    NoteId:
      name: id
      in: path
      required: true
      description: ID CUID catatan.
      schema:
        $ref: "#/components/schemas/Cuid"
    UserId:
      name: userId
      in: path
      required: true
      description: ID CUID pengguna pada sesi aktif.
      schema:
        $ref: "#/components/schemas/Cuid"
    Page:
      name: page
      in: query
      required: false
      description: Nomor halaman; default 1.
      schema:
        type: integer
        minimum: 1
        maximum: 10000
        default: 1
    Batas:
      name: batas
      in: query
      required: false
      description: Jumlah catatan per halaman; default 20, maksimum 50.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    Category:
      name: category
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/NoteCategory"
  responses:
    Problem:
      description: Kesalahan dalam format Problem Details RFC 9457.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Cuid:
      type: string
      pattern: "^[cC][a-z0-9]{7,}$"
      description: Format yang diterima oleh validator Zod string().cuid().
      examples:
        - c123456789012345678901234
    NoteCategory:
      type: string
      enum:
        - Personal
        - Akademik
        - Produktivitas
        - Lainnya
    CreateNote:
      type: object
      additionalProperties: false
      required:
        - title
        - content
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
          description: Dipangkas sebelum validasi dan penyimpanan.
        content:
          type: string
          minLength: 1
          maxLength: 20000
          description: Dipangkas sebelum validasi dan penyimpanan.
        category:
          oneOf:
            - $ref: "#/components/schemas/NoteCategory"
            - type: "null"
    PatchNote:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
          description: Dipangkas sebelum validasi dan penyimpanan.
        content:
          type: string
          minLength: 1
          maxLength: 20000
          description: Dipangkas sebelum validasi dan penyimpanan.
        category:
          oneOf:
            - $ref: "#/components/schemas/NoteCategory"
            - type: "null"
    Note:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - content
        - category
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: "#/components/schemas/Cuid"
        title:
          type: string
        content:
          type: string
        category:
          oneOf:
            - $ref: "#/components/schemas/NoteCategory"
            - type: "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    NoteResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/Note"
    NoteListResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Note"
        pagination:
          type: object
          additionalProperties: false
          required:
            - page
            - batas
            - total
            - totalPages
          properties:
            page:
              type: integer
              minimum: 1
            batas:
              type: integer
              minimum: 1
              maximum: 50
            total:
              type: integer
              minimum: 0
            totalPages:
              type: integer
              minimum: 0
    Problem:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - status
        - detail
        - instance
      properties:
        type:
          type: string
          const: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          description: Path request tanpa query string.
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - path
              - message
            properties:
              path:
                type: string
              message:
                type: string
